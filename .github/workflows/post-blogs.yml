name: Post engineering blogs to Slack

on:
  schedule:
    # 9am, 12pm, 3pm, 6pm IST, Mon-Fri (IST = UTC+5:30)
    - cron: "30 3,6,9,12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: node fetch-and-post.js
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Commit updated posted.json
        run: |
          git config user.name "eng-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet || git commit -m "Update posted links"
          git push
