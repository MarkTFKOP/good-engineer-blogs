name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "sources.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/configure-pages@v5

      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - name: Arrange output under /blogs
        run: |
          mkdir -p deploy/blogs
          cp -R site/dist/. deploy/blogs/
          echo "good-engineer.justmarkphilip.com" > deploy/CNAME
          printf '<!doctype html>\n<meta charset="utf-8">\n<meta http-equiv="refresh" content="0; url=/blogs/">\n<title>Good Engineer Blogs</title>\n<p><a href="/blogs/">Continue to Good Engineer Blogs</a></p>\n' > deploy/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
